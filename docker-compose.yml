services:
    postgres:
        image: 'postgres:15'
        volumes:
            - postgres_data:/var/lib/postgresql/data
        environment:
            - POSTGRES_USER=user
            - POSTGRES_PASSWORD=password
            - POSTGRES_DB=loans
        ports:
            - '5432:5432'

    webserver:
        image: 'nginx:alpine'
        working_dir: /app
        volumes:
            - '.:/app'
            - './.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf'
        ports:
            - '80:80'
        depends_on:
            - php-fpm

    php-fpm:
        build:
            context: .
            dockerfile: .docker/php-fpm/Dockerfile
        working_dir: /app
        volumes:
            - '.:/app'
            - './.docker/php-fpm/php-ini-overrides.ini:/etc/php/8.2/fpm/conf.d/99-overrides.ini'
        ports:
            - '8080:8080'
        depends_on:
            - postgres

volumes:
    postgres_data: